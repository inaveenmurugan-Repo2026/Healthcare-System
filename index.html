<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Employee Management System - Login</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header id="pageHeader">

        <!-- Hospital Logo -->
        <div id="hospitalLogo">
            <img
                src="images/hospital-logo.png"
                alt="Hospital Logo"
                id="hospitalLogoImage">
        </div>

        <h1 id="appTitle">
            Hospital Employee Management System
        </h1>

        <p id="appSubtitle">
            Secure Employee Portal
        </p>

    </header>

    <!-- Main Content -->
    <main id="mainContent">

        <section id="loginSection" aria-labelledby="loginHeading">

            <h2 id="loginHeading">
                Employee Login
            </h2>

            <form id="loginForm" novalidate>

                <!-- Username -->
                <div id="usernameFieldGroup">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        autocomplete="username"
                        required>

                </div>

                <!-- Password -->
                <div id="passwordFieldGroup">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required>

                </div>

                <!-- Error -->
                <div
                    id="errorMessageContainer"
                    role="alert"
                    aria-live="assertive">

                    <p id="errorMessage" hidden></p>

                </div>

                <!-- Login -->
                <button
                    type="submit"
                    id="loginBtn">

                    Login

                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer id="pageFooter">

        <p id="footerText">
            © 2026 Hospital Employee Management System
        </p>

    </footer>

    <script src="js/auth.js"></script>

</body>
</html>
